<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05041e"/>
      <stop offset="100%" stop-color="#150410"/>
    </linearGradient>
    <radialGradient id="gr" cx="180" cy="250" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e20626" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#e20626" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gp" cx="1050" cy="480" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7e22ce" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#gr)"/>
  <rect width="1200" height="630" fill="url(#gp)"/>

  <!-- Subtle divider -->
  <line x1="600" y1="40" x2="600" y2="590" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- ── LEFT: TEXT CONTENT ── -->

  <!-- Brand -->
  <text x="72" y="88"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
    font-weight="700" font-size="19" fill="#e20626" letter-spacing="3.5">BACKBLAZE B2</text>

  <!-- Headline -->
  <text x="72" y="205"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
    font-weight="800" font-size="76" fill="white" letter-spacing="-2">See what you</text>
  <text x="72" y="302"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
    font-weight="800" font-size="76" fill="white" letter-spacing="-2">actually pay.</text>

  <!-- Subtitle -->
  <text x="72" y="378"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
    font-weight="400" font-size="27" fill="rgba(255,255,255,0.62)">Model storage, egress, and transactions.</text>
  <text x="72" y="418"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
    font-weight="400" font-size="27" fill="rgba(255,255,255,0.62)">Compare B2 vs S3, Azure, R2, and GCS.</text>

  <!-- Feature pills -->
  <rect x="72" y="460" width="192" height="40" rx="20" fill="rgba(226,6,38,0.18)" stroke="rgba(226,6,38,0.45)" stroke-width="1"/>
  <text x="168" y="485" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
    font-weight="600" font-size="17" fill="#ff7a8a">3x free egress</text>

  <rect x="278" y="460" width="170" height="40" rx="20" fill="rgba(226,6,38,0.18)" stroke="rgba(226,6,38,0.45)" stroke-width="1"/>
  <text x="363" y="485" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
    font-weight="600" font-size="17" fill="#ff7a8a">$0 transactions</text>

  <!-- URL -->
  <text x="72" y="578"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
    font-weight="500" font-size="19" fill="rgba(255,255,255,0.32)">backblaze.com</text>

  <!-- ── RIGHT: BAR CHART ── -->
  <!-- Baseline y=552, max bar height=360 (top y=192) -->
  <!-- 5 bars x 70px + 4 gaps x 18px = 422px, start x=689 (centered in 600px) -->

  <!-- "Annual cost" label -->
  <text x="900" y="172" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
    font-weight="500" font-size="17" fill="rgba(255,255,255,0.3)">Annual cost comparison</text>

  <!-- B2 bar (shortest = cheapest) -->
  <rect x="689" y="468" width="70" height="84" rx="7" fill="#e20626"/>
  <rect x="689" y="468" width="70" height="28" rx="7" fill="rgba(255,255,255,0.14)"/>

  <!-- R2 bar -->
  <rect x="777" y="388" width="70" height="164" rx="7" fill="rgba(246,130,31,0.5)"/>

  <!-- Azure bar -->
  <rect x="865" y="302" width="70" height="250" rx="7" fill="rgba(0,120,212,0.5)"/>

  <!-- S3 bar -->
  <rect x="953" y="232" width="70" height="320" rx="7" fill="rgba(255,153,0,0.5)"/>

  <!-- GCS bar -->
  <rect x="1041" y="192" width="70" height="360" rx="7" fill="rgba(52,168,83,0.5)"/>

  <!-- Baseline -->
  <rect x="669" y="552" width="462" height="1" fill="rgba(255,255,255,0.18)"/>

  <!-- Provider name labels -->
  <text x="724" y="576" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
    font-weight="700" font-size="16" fill="rgba(255,255,255,0.95)">B2</text>
  <text x="812" y="576" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
    font-weight="600" font-size="16" fill="rgba(255,255,255,0.5)">R2</text>
  <text x="900" y="576" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
    font-weight="600" font-size="16" fill="rgba(255,255,255,0.5)">Azure</text>
  <text x="988" y="576" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
    font-weight="600" font-size="16" fill="rgba(255,255,255,0.5)">S3</text>
  <text x="1076" y="576" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
    font-weight="600" font-size="16" fill="rgba(255,255,255,0.5)">GCS</text>

  <!-- "Cheapest" callout above B2 -->
  <rect x="694" y="430" width="120" height="30" rx="15" fill="#e20626"/>
  <text x="754" y="450" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
    font-weight="700" font-size="14" fill="white">Cheapest</text>
  <line x1="724" y1="460" x2="724" y2="467" stroke="#e20626" stroke-width="2" stroke-linecap="round"/>
</svg>
